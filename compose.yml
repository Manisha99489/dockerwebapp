version: "3.9"

services:
  devopsdb:
    image: manisha7799/flm-oct:mydb
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: manisha7799/flm-oct:javaapp
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
